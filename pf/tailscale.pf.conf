# Let tailnet traffic through before Mullvad's kill-switch rules.
#
# Loaded into the "com.apple/tailscale" anchor. macOS's stock /etc/pf.conf
# evaluates `anchor "com.apple/*"` before the "mullvad" anchor that the Mullvad
# daemon adds, so these `quick` rules win.
#
# Stateless (`no state`) on purpose: Mullvad flushes all pf states whenever it
# changes tunnel state, which would otherwise drop open SSH sessions etc.
#
# Only Tailscale's own address ranges are allowed. Regular internet traffic is
# still forced through Mullvad.
ts4 = "100.64.0.0/10"
ts6 = "fd7a:115c:a1e0::/48"

pass out quick inet  from any  to $ts4  no state
pass in  quick inet  from $ts4 to any   no state
pass out quick inet6 from any  to $ts6  no state
pass in  quick inet6 from $ts6 to any   no state
